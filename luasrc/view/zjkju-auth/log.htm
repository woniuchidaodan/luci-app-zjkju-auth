<%
local sys = require "luci.sys"
local log = sys.exec("logread -e zjkju-auth 2>/dev/null | tail -100")
if not log or log == "" then log = "（暂无日志，服务可能还未启动过）" end
%>

<style>
.zjkju-log-head {
	display: flex;
	justify-content: space-between;
	align-items: center;
	margin-bottom: 8px;
}
.zjkju-log-head h3 { margin: 0; }
.zjkju-log-status { font-size: 12px; color: #888; }
.zjkju-log-box {
	background: #1e1e1e;
	color: #d4d4d4;
	font-family: Menlo, Consolas, Monaco, monospace;
	font-size: 12px;
	line-height: 1.5;
	padding: 12px;
	border-radius: 4px;
	max-height: 400px;
	overflow: auto;
	white-space: pre-wrap;
	word-break: break-all;
	margin: 0;
}
.zjkju-btn {
	display: inline-block;
	padding: 5px 12px;
	margin-left: 8px;
	background: #2f80ed;
	color: #fff;
	border: none;
	border-radius: 3px;
	cursor: pointer;
	font-size: 12px;
}
.zjkju-btn:hover { background: #1c6dd0; }
.zjkju-btn:active { background: #155bb5; }
</style>

<div class="cbi-section">
	<div class="zjkju-log-head">
		<h3><%:运行日志%></h3>
		<div>
			<span class="zjkju-log-status" id="zjkju-log-status"><%:每 10 秒自动刷新%></span>
			<button class="zjkju-btn" onclick="zjkjuRefresh()"><%:立即刷新%></button>
			<button class="zjkju-btn" onclick="zjkjuRestart()"><%:重启服务%></button>
		</div>
	</div>
	<pre class="zjkju-log-box" id="zjkju-log"><%=pcdata(log)%></pre>
</div>

<script type="text/javascript">
(function() {
	var logUrl = '<%=luci.dispatcher.build_url("admin", "services", "zjkju-auth", "log")%>';
	var restartUrl = '<%=luci.dispatcher.build_url("admin", "services", "zjkju-auth", "restart")%>';
	var logBox = document.getElementById('zjkju-log');
	var statusBox = document.getElementById('zjkju-log-status');
	if (!logBox) return;

	logBox.scrollTop = logBox.scrollHeight;

	window.zjkjuRefresh = function() {
		XHR.get(logUrl, null, function(x) {
			if (x && x.status === 200 && x.responseText !== undefined) {
				var atBottom = (logBox.scrollHeight - logBox.scrollTop - logBox.clientHeight) < 30;
				logBox.textContent = x.responseText;
				if (atBottom) logBox.scrollTop = logBox.scrollHeight;
				if (statusBox) {
					var d = new Date();
					statusBox.textContent = '最后更新: ' + d.toLocaleTimeString() + ' (每 10 秒自动刷新)';
				}
			}
		});
	};

	window.zjkjuRestart = function() {
		if (!confirm('<%:确定要重启认证服务吗？%>')) return;
		XHR.get(restartUrl, null, function() {
			setTimeout(window.zjkjuRefresh, 1500);
		});
	};

	setInterval(window.zjkjuRefresh, 10000);
})();
</script>
